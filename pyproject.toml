[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-1"
version = "0.1.0"
description = "Multimodal brain-encoding benchmark"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "h5py>=3.16",
  "numpy>=2.1",
  "pandas>=3.0",
  "pillow>=11.2",
  "pydantic>=2.10",
  "pyyaml>=6.0.2",
  "soundfile>=0.13.1",
  "torch>=2.6",
  "torchvision>=0.21",
  "transformers>=4.57",
  "uvicorn>=0.34",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.11",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
