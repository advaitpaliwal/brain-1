seed: 1337

data:
  manifest_path: tests/.tmp/missing.jsonl
  synthetic_fallback_size: 4
  synthetic_seq_len: 8

optimization:
  batch_size: 2
  lr: 1.0e-4
  weight_decay: 0.01
  max_steps: 2
  warmup_steps: 0

loss:
  mse_weight: 1.0
  correlation_weight: 0.1

training:
  device: cpu
  mixed_precision: "no"
  grad_clip_norm: 1.0
  log_every: 1
  eval_every: 100
  checkpoint_every: 100
