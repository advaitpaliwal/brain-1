seed: 1337

data:
  manifest_path: data/manifests/algonauts2025_text_train.jsonl
  synthetic_fallback_size: 0
  synthetic_seq_len: 0

optimization:
  batch_size: 1
  lr: 1.0e-4
  weight_decay: 0.01
  max_steps: 20
  warmup_steps: 0

loss:
  mse_weight: 1.0
  correlation_weight: 0.1

training:
  device: mps
  mixed_precision: "no"
  grad_clip_norm: 1.0
  log_every: 1
  eval_every: 100
  checkpoint_every: 100
  output_dir: artifacts/algonauts_text_baseline
